<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title> 

 <style>

/* genarl style */
*{
    margin: 0 ;
    padding: 0 ;
    box-sizing: border-box;

}
 body{
     height: 100vh;
 
     width: 100%;

     background-color:#a4e08b;

       display: flex;

     justify-content: center    ;
    
     align-items: center;
    

}
.wrapper{
    height: 400px;
    width: 100px;
    position: relative;
      display: flex;
    justify-content: center;
}
/* Ball style */

.ball{
    position: absolute;
    top: 0;
    height: 100px;
    width: 100px;
    background-color: #e98bf7;
    border-radius: 50%;
    box-shadow: 0-10px 20px gray;
    animation: bounce 0.7s cubic-bezier(0.49,0,0.89,0.74 ) infinite alternate;
    animation-name: bounce;

}
/* shadow style */
.shadow{
    position: absolute;
    top: 400px;
    height: 25px;
    width: 150px;
    background-color: black;
    border-radius: 50%;
    box-shadow:0 0 10px black;
    z-index: -1;
    animation-name: shadow;

}

/* Ball bounce animaition */
@keyframes bounce{
    0%{
        transform: translateY(0px);
        height: 100px;
        width: 100;
    }
     75%{
        height: 100px;
        width: 100;
   }
90%{
        height: 95px;
        width: 105;

}
100%{
 transform: translateY(320px);
        height:90px;
        width: 110;
}

}

/* shadow animaitoin */
@keyframes shadow{
    0%{
       opacity: 0.1;
       width: 110px;
       height: 20px;
    }

    80%{
        opacity: 0.4;
        height:15px ;
        width:90px ;
    }
    100%{
        opacity:0.5 ;
        height:80px;
        width: 10px;
    }
}
</style>
    
</head>
<body>

     <div class="wrapper">
     <div class="ball"></div>
     <div class="shadow"></div>
     </div>
</body>
</html>
